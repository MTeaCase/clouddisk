<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)" />
    <meta name="referrer" content="no-referrer" />
    <title>云盘</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-cloud" viewBox="0 0 24 24">
        <path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.62-1.2A4 4 0 0 1 17 18.5H7.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l1.7 2.2h7.3a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V7.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9l-5.5-5.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M13.5 3.5V9H19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
        <circle cx="8.8" cy="9.6" r="1.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="m4.6 17.2 4.6-4.4 3.2 3 2.7-2.4 4.3 3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-video" viewBox="0 0 24 24">
        <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="m10.4 9.5 4.5 2.5-4.5 2.5v-5Z" fill="currentColor" />
      </symbol>
      <symbol id="i-audio" viewBox="0 0 24 24">
        <path d="M9 17V7.5l8-2V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <circle cx="7" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <circle cx="15" cy="15" r="2" fill="none" stroke="currentColor" stroke-width="1.7" />
      </symbol>
      <symbol id="i-archive" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="4.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M5 9.5v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M10 13h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24">
        <path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9l-5.5-5.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M8.4 14.6h1.9a1.5 1.5 0 0 0 0-3H8.4v5m4.2 0v-5h1.5a1.6 1.6 0 0 1 0 3.2h-1.5m0 0v1.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-doc" viewBox="0 0 24 24">
        <path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9l-5.5-5.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M8.5 13h7M8.5 16.5h4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16.5V5.8m0 0L8.2 9.6M12 5.8l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M4.5 16.2v1.3a2.5 2.5 0 0 0 2.5 2.5h10a2.5 2.5 0 0 0 2.5-2.5v-1.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4.8v10.7m0 0 3.8-3.8M12 15.5l-3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M4.5 16.2v1.3a2.5 2.5 0 0 0 2.5 2.5h10a2.5 2.5 0 0 0 2.5-2.5v-1.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4.8 6.8h14.4M9.5 6.8V5.2a1.5 1.5 0 0 1 1.5-1.5h2a1.5 1.5 0 0 1 1.5 1.5v1.6M7 6.8l.8 11.4a2 2 0 0 0 2 1.8h4.4a2 2 0 0 0 2-1.8L17 6.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-restore" viewBox="0 0 24 24">
        <path d="M4.6 12a7.4 7.4 0 1 0 2.2-5.2M4.6 12V7.2m0 4.8h4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-share" viewBox="0 0 24 24">
        <circle cx="17.2" cy="6.2" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <circle cx="6.8" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <circle cx="17.2" cy="17.8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="m9.2 10.8 5.6-3.2m-5.6 5.6 5.6 3.2" fill="none" stroke="currentColor" stroke-width="1.7" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M15.2 4.9a2.1 2.1 0 0 1 3 3L8.4 17.7l-4 1 1-4L15.2 4.9Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.3" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="m15.8 15.8 3.7 3.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="4" y="4" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <rect x="13" y="4" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <rect x="4" y="13" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <rect x="13" y="13" width="7" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="M8 6.5h12M8 12h12M8 17.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="4.4" cy="6.5" r="1.2" fill="currentColor" />
        <circle cx="4.4" cy="12" r="1.2" fill="currentColor" />
        <circle cx="4.4" cy="17.5" r="1.2" fill="currentColor" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5.5" cy="12" r="1.5" fill="currentColor" />
        <circle cx="12" cy="12" r="1.5" fill="currentColor" />
        <circle cx="18.5" cy="12" r="1.5" fill="currentColor" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="4.8" y="10.5" width="14.4" height="9.7" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M8.4 10.5V8a3.6 3.6 0 0 1 7.2 0v2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.4 4.4L19 7.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M12 4.5 21 20H3l9-15.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M12 10v4.2M12 17.2v.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M6.5 15.2H5.7A1.7 1.7 0 0 1 4 13.5V5.7A1.7 1.7 0 0 1 5.7 4h7.8a1.7 1.7 0 0 1 1.7 1.7v.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
    </svg>

    <section id="login-view" class="login" hidden>
      <form id="login-form" class="login-card" autocomplete="on">
        <div class="login-mark"><svg class="icon" aria-hidden="true"><use href="#i-cloud" /></svg></div>
        <h1>云盘</h1>
        <p class="login-sub">输入访问密码，进入你的私有空间</p>
        <label class="field">
          <span class="field-label">访问密码</span>
          <span class="field-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required minlength="4" />
            <button type="button" id="toggle-password" class="field-action" aria-label="显示密码">显示</button>
          </span>
        </label>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">进入云盘</button>
        <p class="login-foot">数据保存在你的 Cloudflare R2 存储桶中，不经过第三方。</p>
      </form>
    </section>

    <div id="shell" class="shell" hidden>
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-cloud" /></svg></span>
          <span class="brand-name">云盘</span>
        </div>
        <nav class="nav">
          <button class="nav-item is-active" data-nav="files">
            <svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg><span>我的文件</span>
          </button>
          <button class="nav-item" data-nav="trash">
            <svg class="icon" aria-hidden="true"><use href="#i-trash" /></svg><span>回收站</span>
            <span id="trash-badge" class="nav-badge" hidden></span>
          </button>
        </nav>
        <div class="quota" id="quota">
          <div class="quota-head">
            <span>存储空间</span>
            <span id="quota-percent" class="quota-percent">—</span>
          </div>
          <div class="quota-bar"><span id="quota-fill"></span></div>
          <div class="quota-text" id="quota-text">正在统计…</div>
          <button id="quota-free" class="quota-free" hidden>清空回收站释放空间</button>
        </div>
        <div class="sidebar-foot">
          <button id="theme-toggle" class="icon-btn" aria-label="切换主题" title="切换主题">
            <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun" /></svg>
            <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon" /></svg>
          </button>
          <button id="logout" class="text-btn">退出登录</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button id="sidebar-toggle" class="icon-btn only-mobile" aria-label="打开导航">
            <svg class="icon" aria-hidden="true"><use href="#i-list" /></svg>
          </button>
          <nav id="breadcrumb" class="breadcrumb" aria-label="路径"></nav>
          <div class="topbar-actions">
            <label class="search">
              <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
              <input id="search-input" type="search" placeholder="搜索文件（Enter）" aria-label="搜索文件" />
              <kbd>/</kbd>
            </label>
            <button id="new-folder" class="btn btn-ghost only-desktop" title="新建文件夹">
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg><span>新建文件夹</span>
            </button>
            <button id="upload-btn" class="btn btn-primary">
              <svg class="icon" aria-hidden="true"><use href="#i-upload" /></svg><span>上传</span>
            </button>
            <div class="icon-group">
              <button id="view-list" class="icon-btn" aria-label="列表视图" aria-pressed="true">
                <svg class="icon" aria-hidden="true"><use href="#i-list" /></svg>
              </button>
              <button id="view-grid" class="icon-btn" aria-label="网格视图" aria-pressed="false">
                <svg class="icon" aria-hidden="true"><use href="#i-grid" /></svg>
              </button>
            </div>
          </div>
        </header>

        <div id="banner" class="banner" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
          <span id="banner-text"></span>
          <button id="banner-action" class="banner-action" hidden></button>
        </div>

        <section class="content" id="content">
          <div class="list-toolbar" id="list-toolbar">
            <div class="selection-info" id="selection-info" hidden>
              <span id="selection-count"></span>
              <button class="text-btn" id="selection-download">下载</button>
              <button class="text-btn danger" id="selection-delete">删除</button>
              <button class="text-btn" id="selection-clear">取消选择</button>
            </div>
            <div class="sort-info" id="sort-info"></div>
          </div>
          <div class="table-wrap">
            <table class="table" id="table" hidden>
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="select-all" aria-label="全选" /></th>
                  <th class="col-name sortable" data-sort="name">名称</th>
                  <th class="col-size sortable" data-sort="size">大小</th>
                  <th class="col-date sortable" data-sort="date">修改时间</th>
                  <th class="col-actions"></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="grid" id="grid" hidden></div>
          <div class="empty" id="empty" hidden>
            <div class="empty-art"><svg class="icon" aria-hidden="true"><use href="#i-cloud" /></svg></div>
            <p class="empty-title" id="empty-title">这里还是空的</p>
            <p class="empty-text" id="empty-text">把文件拖到窗口任意位置，或点击右上角「上传」。</p>
            <button class="btn btn-ghost" id="empty-upload">选择文件上传</button>
          </div>
          <div class="loading" id="loading" hidden><span class="spinner"></span>加载中…</div>
          <div class="load-more" id="load-more" hidden><button class="btn btn-ghost" id="load-more-btn">加载更多</button></div>
        </section>

        <footer class="statusbar">
          <span id="status-left"></span>
          <span id="status-right"></span>
        </footer>
      </main>
    </div>

    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-inner">
        <svg class="icon" aria-hidden="true"><use href="#i-upload" /></svg>
        <p>松开即可上传到 <strong id="drop-target">当前目录</strong></p>
      </div>
    </div>

    <section id="uploads" class="uploads" hidden aria-label="上传队列">
      <header class="uploads-head">
        <span id="uploads-title">上传中…</span>
        <button id="uploads-collapse" class="icon-btn" aria-label="收起">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron" /></svg>
        </button>
      </header>
      <ul id="upload-list" class="upload-list"></ul>
      <footer class="uploads-foot">
        <span id="uploads-speed"></span>
        <button id="uploads-clear" class="text-btn" hidden>清除已完成</button>
      </footer>
    </section>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="menu" class="menu" hidden role="menu"></div>
    <input id="file-picker" type="file" multiple hidden />
    <input id="folder-picker" type="file" webkitdirectory multiple hidden />
  </body>
</html>
